[package]
name = "shiny-tracker"
version = "0.7.2-2"
edition = "2021"
description = "Always-on-top shiny hunting counter that reads foe name plates from the screen"

[dependencies]
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["gif", "png"] }
# JPG profile pictures (pure Rust; already in Cargo.lock through other crates).
jpeg-decoder = { version = "0.3", default-features = false }
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
xcap = "0.0"
global-hotkey = "0.6"
raw-window-handle = "0.6"
# Font drawing for share images (already used inside egui).
ab_glyph = "0.2"
# GIF writing for animated share images (already used by the image crate).
gif = "0.13"
# Colour reduction for GIF frames, so they can be dithered (already used by gif).
color_quant = "1.1"

[features]
# Shiny Replay's recorder (captures the game window, writes MP4s with
# Windows' own video encoder). On in every build; build without it with
# --no-default-features if it ever needs switching off.
default = ["replay-rec"]
replay-rec = [
    "windows/Graphics",
    "windows/Graphics_Capture",
    "windows/Graphics_DirectX",
    "windows/Graphics_DirectX_Direct3D11",
    "windows/Win32_Foundation",
    "windows/Win32_Graphics_Direct3D",
    "windows/Win32_Graphics_Direct3D11",
    "windows/Win32_Graphics_Dwm",
    "windows/Win32_Graphics_Dxgi",
    "windows/Win32_Graphics_Dxgi_Common",
    "windows/Win32_Graphics_Gdi",
    "windows/Win32_Media_MediaFoundation",
    "windows/Win32_System_Com",
    "windows/Win32_System_Com_StructuredStorage",
    "windows/Win32_System_Threading",
    "windows/Win32_System_WinRT",
    "windows/Win32_System_WinRT_Direct3D11",
    "windows/Win32_System_WinRT_Graphics_Capture",
    "windows/Win32_UI_WindowsAndMessaging",
]

# Windows' built-in OCR (no extra install needed on Windows 10/11).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

# Native "choose folder" / "save as" boxes for share images.
[target.'cfg(windows)'.dependencies.rfd]
version = "0.15"

# Embeds the icon into the .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# Image work is slow in unoptimised builds; optimise dependencies even in dev.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(offline_test)'] }
